<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>Studio Tools</title>
    <link rel="stylesheet" href="renderer.css" />
  </head>
  <body>
    <header id="top">
      <div class="brand">
        <div class="name">Studio Tools</div>
        <div class="sub" id="sub">Evoke Training Studio</div>
      </div>
      <div class="summary" id="summary">Reading this computer…</div>
      <div class="actions">
        <button id="refresh" class="small">Refresh</button>
        <button id="github" class="small">Check GitHub</button>
        <button id="details-toggle" class="small">Details</button>
      </div>
    </header>

    <section id="details" hidden>
      <div class="suggest">
        <div class="label">Suggested next</div>
        <div id="suggestions" class="chips"></div>
      </div>
      <div class="grid">
        <div class="card"><h3>This computer</h3><div id="computer"></div></div>
        <div class="card"><h3>Published</h3><div id="published"></div></div>
        <div class="card"><h3>Git</h3><div id="git"></div></div>
      </div>
      <div class="card"><h3>Licences</h3><div id="licences"></div></div>
      <div class="card"><h3>Apps</h3><div id="apps"></div></div>
      <div id="errors" class="errors" hidden></div>
    </section>

    <main>
      <aside id="jobs"></aside>
      <section id="work">
        <div id="card" class="jobcard">
          <div class="muted">Choose a job on the left.</div>
        </div>
        <div id="termwrap">
          <div id="termbar">
            <span id="termtitle">Terminal</span>
            <span id="termstate" class="muted"></span>
            <span class="spacer"></span>
            <button id="stop" class="small danger" hidden>Stop</button>
            <button id="clear" class="small">Clear</button>
          </div>
          <div id="terminal"></div>
        </div>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
